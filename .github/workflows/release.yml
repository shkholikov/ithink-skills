name: Release skill zips

# Produces zips people upload at Settings -> Capabilities -> Skills on
# claude.ai. Two ways in:
#
#   push a tag         v1.2.0 -> all three skills, system-diagram-v1.1.0 -> one
#   run it by hand     supply the version; gh creates the tag from this commit
on:
  push:
    tags:
      - 'v*'
      - 'topology-creator-v*'
      - 'system-diagram-v*'
      - 'ithink-documents-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.1.0 (or system-diagram-v1.1.0 for one skill)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version and which skills it covers
        id: scope
        run: |
          version="${{ inputs.version || github.ref_name }}"
          case "$version" in
            topology-creator-v*) skills="topology-creator" ;;
            system-diagram-v*)   skills="system-diagram" ;;
            ithink-documents-v*) skills="ithink-documents" ;;
            v*)                  skills="topology-creator system-diagram ithink-documents" ;;
            *) echo "error: version '$version' must start with v or <skill>-v" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skills=$skills" >> "$GITHUB_OUTPUT"

      - name: Run the skill test suites
        run: |
          for skill in ${{ steps.scope.outputs.skills }}; do
            if [ -d "$skill/tests" ]; then
              echo "== $skill =="
              ( cd "$skill" && for t in tests/test_*.py; do python3 "$t"; done )
            fi
          done

      - name: Build the zips
        run: ./scripts/package.sh --version "${{ steps.scope.outputs.version }}" ${{ steps.scope.outputs.skills }}

      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.scope.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          Download a skill's `.zip` below, then upload it in the Claude app at
          **Settings -> Capabilities -> Skills**.

          Step-by-step install guides:
          [O'zbekcha](https://github.com/shkholikov/ithink-skills/blob/main/INSTALL.uz.md)
          · [Русский](https://github.com/shkholikov/ithink-skills/blob/main/INSTALL.ru.md)
          NOTES
          # --target makes gh create the tag from this commit when it does not
          # already exist, so a release needs no separate tag push.
          gh release create "$VERSION" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md
